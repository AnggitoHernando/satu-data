---
deployment:
  tasks:
    # Tentukan path folder tujuan di hosting (domain folder)
    - export DEPLOYPATH=/home/u1482575/public_html/mandat/

    # Salin semua file dari repo ke folder deploy (kecuali file sistem & git)
    - /bin/rsync -av --exclude '.git' --exclude '.cpanel.yml' ./ $DEPLOYPATH

    # Masuk ke folder deploy
    - cd $DEPLOYPATH

    # Jalankan Composer agar dependensi Laravel terinstall
    - /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader

    # Pastikan .env sudah ada
    - if [ ! -f .env ]; then echo ".env file not found!"; exit 1; fi

    # Set permission agar Laravel bisa menulis di storage & cache
    - find storage -type d -exec chmod 775 {} \;
    - find bootstrap/cache -type d -exec chmod 775 {} \;

    # Cache config, route, dan view untuk performa maksimal
    - php artisan config:clear
    - php artisan config:cache
    - php artisan route:cache
    - php artisan view:cache

    # Set permission ulang untuk file cache
    - chmod -R 775 storage bootstrap/cache
